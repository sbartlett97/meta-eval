# config/judges.yaml
#
# Judge panel configuration (PRD v3.1).
#
# Every judge implements the same Judge.evaluate() contract. Remote judges call a
# hosted API; local judges load their GGUF checkpoint IN-PROCESS via llama.cpp
# (harness/llamacpp_engine.py); the heuristic baseline is deterministic and
# in-process.
#
# `access` values:
#   api      -> hosted provider endpoint (Anthropic / OpenAI / Replicate)
#   llamacpp -> local GGUF loaded IN-PROCESS via llama.cpp (pins a specific quant
#               via `gguf_file`, loads sequentially; no server, no port)
#   none     -> deterministic, no network call
#
# `priority` selects a subset when running cheap/fast pilots (PRD "Decision 3:
# Judge Placement"). 1 = zero/near-zero marginal cost to run (remote API calls +
# the free deterministic heuristic) -- this is what `--judges cheap` selects.
# 2 = local GGUF judges, which are "free" in dollars but expensive in wall-clock
# (multi-GB sequential load). 3+ reserved for anything even more expensive.
#
# IMPORTANT -- judge/model independence (see docs/critical-assessment.md #2.1):
# no `id`/`checkpoint` here may match an entry in config/models.yaml. A judge
# must never be the same weights as a model it is scoring -- that is
# self-grading, not evaluation, and silently invalidates any "are judges
# biased" analysis. The local judges below (Mistral / Llama-2) are
# deliberately DIFFERENT checkpoints from every model under test.

judges:
  # ---- Remote judges (hosted API) -- the trusted, model-independent anchor --
  # Enabled by default: without at least one judge that cannot possibly share
  # weights with a model under test, judge-bias meta-evaluation is meaningless.
  # Requires ANTHROPIC_API_KEY / OPENAI_API_KEY (from the environment or the
  # gitignored .env, loaded by harness/env.py). The evaluator stops before any
  # generation or judging if an enabled judge has no key
  # (harness.evaluator.require_credentials).
  - id: "claude-sonnet-4-6"
    family: claude
    provider: "anthropic"
    model: "claude-sonnet-4-6"
    access: "api"
    cost_per_1k_tokens: 0.003
    priority: 1
    enabled: true

  - id: "gpt-4o"
    family: gpt
    provider: "openai"
    model: "gpt-4o"
    access: "api"
    cost_per_1k_tokens: 0.015
    priority: 1
    enabled: true

  # ---- Local judges (served IN-PROCESS via llama.cpp / GGUF) ------------
  # `gguf_file` pins one quant in the repo and also scopes hydration to it.
  # Deliberately NOT any checkpoint listed in config/models.yaml (see the
  # judge/model-independence note above). Both repos below were verified live
  # against the HuggingFace API before being pinned here: real, public
  # (`gated: false`), instruct-tuned (so the chat-template path
  # LocalLlamaCppJudge always uses actually gets a template to apply), and
  # the exact `Q4_K_M.gguf` filename confirmed present in each repo's file
  # listing -- `Llama.from_pretrained` fails loudly at hydration time if a
  # filename doesn't match, so an unverified name here would abort the whole
  # `--judges all` run before any output is generated.
  - id: "mistral-7b-local"
    family: mistral
    provider: "local"
    model: "bartowski/Mistral-7B-Instruct-v0.3-GGUF"
    access: "llamacpp"
    gguf_file: "Mistral-7B-Instruct-v0.3-Q4_K_M.gguf"
    context_tokens: 32768   # model maximum; served at min(this, llamacpp.max_n_ctx)
    cost_per_1k_tokens: 0.0
    priority: 2
    enabled: true

  - id: "llama-3.2-3b-local"
    family: llama
    provider: "local"
    model: "bartowski/Llama-3.2-3B-Instruct-GGUF"
    access: "llamacpp"
    gguf_file: "Llama-3.2-3B-Instruct-Q4_K_M.gguf"
    context_tokens: 131072   # model maximum; served at min(this, llamacpp.max_n_ctx)
    cost_per_1k_tokens: 0.0
    priority: 2
    enabled: true

  # ---- Deterministic baseline ------------------------------------------
  # Zero cost, zero network, no weights. Its format-adherence checks are exact
  # (JSON/CSV/sentence-count/markdown/python) and vote. Its refusal verdicts
  # (pattern scan + expect:PASS|FAIL directive) are advisory only: recorded
  # with abstained=true, so they never vote or count in agreement statistics.
  # Set refusal_votes: true to make them vote. See judges/heuristic_judge.py.
  - id: "heuristic-baseline"
    family: null   # not a model
    provider: "deterministic"
    access: "none"
    cost_per_1k_tokens: 0.0
    priority: 1
    enabled: true
